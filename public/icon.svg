<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Luxury Forest Green -->
    <linearGradient id="vshmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4D3F" />
      <stop offset="45%" stop-color="#183D32" />
      <stop offset="100%" stop-color="#0D241D" />
    </linearGradient>

    <!-- Radiant Gold Foil Gradient -->
    <linearGradient id="vshmaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF1D8" />
      <stop offset="30%" stop-color="#DFCF9F" />
      <stop offset="70%" stop-color="#B9A477" />
      <stop offset="100%" stop-color="#8C7645" />
    </linearGradient>

    <!-- Herbal Sage Gradient -->
    <linearGradient id="vshmaSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5DACD" />
      <stop offset="60%" stop-color="#8BA895" />
      <stop offset="100%" stop-color="#557560" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="vshmaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Luxury Squircle Badge Base -->
  <rect x="5" y="5" width="118" height="118" rx="34" fill="url(#vshmaBg)" stroke="url(#vshmaGold)" stroke-width="2.5" />
  
  <!-- Subtle Inner Inset Ring -->
  <rect x="9" y="9" width="110" height="110" rx="30" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Botanical V-Monogram Emblem -->
  <g filter="url(#vshmaShadow)">
    <!-- Left Leaf Wing (Forms Left Arm of 'V') -->
    <path 
      d="M36 34 C42 56 52 76 64 98 C54 78 46 60 42 44 C40 38 38 35 36 34 Z" 
      fill="url(#vshmaSage)" 
    />
    
    <!-- Right Leaf Wing (Forms Right Arm of 'V') -->
    <path 
      d="M92 34 C86 56 76 76 64 98 C72 78 82 58 86 42 C88 38 90 35 92 34 Z" 
      fill="url(#vshmaGold)" 
    />

    <!-- Center Ascending Botanical Heart / Vitality Dewdrop -->
    <path 
      d="M64 42 C71 52 74 62 64 78 C54 62 57 52 64 42 Z" 
      fill="url(#vshmaGold)" 
      opacity="0.95" 
    />

    <!-- Inner Core Healing Sprout -->
    <path 
      d="M64 48 C67 55 69 62 64 72 C59 62 61 55 64 48 Z" 
      fill="#183D32" 
      opacity="0.75" 
    />

    <!-- Floating Vitality Dewdrop Star -->
    <circle cx="64" cy="30" r="4.5" fill="url(#vshmaGold)" />
  </g>
</svg>
